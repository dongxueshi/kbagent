services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${KBAGENT_MYSQL_DATABASE:-kbagent}
      MYSQL_USER: ${KBAGENT_MYSQL_USER:-kbagent}
      MYSQL_PASSWORD: ${KBAGENT_MYSQL_PASSWORD:?Set KBAGENT_MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${KBAGENT_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -u root --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  minio:
    # Official community images are unavailable; pin the Bitnami archive by digest.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r0@sha256:8935e75fa5d11295c17171e4aa49efe390a1193cd7f12e4d21b92af9ffef09d7
    environment:
      MINIO_ROOT_USER: ${KBAGENT_MINIO_ACCESS_KEY:?Set KBAGENT_MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${KBAGENT_MINIO_SECRET_KEY:?Set KBAGENT_MINIO_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:${KBAGENT_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${KBAGENT_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  mysql-data:
  minio-data:
